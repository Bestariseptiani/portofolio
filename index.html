
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portofolio</title>
    <link rel="stylesheet" href="style/style.css">
</head>
<body>

    <nav class="navbar" id="navbar">
            <span><b>PORTO<span class="red">FOLIO.</b></span></span>
        </a>

        <button class="menu-toggle" id="menuToggle"
                aria-label="Buka menu" aria-expanded="false">
            <span></span>
            <span></span>
            <span></span>
        </button>

        <ul class="nav-links" id="navLinks">
            <li><a href="#about" class="nav-link active">About Me</a></li>
            <li><a href="#experience" class="nav-link">Experience</a></li>
            <li><a href="#education" class="nav-link">Education</a></li>
            <li><a href="#organization" class="nav-link">Organization</a></li>
            <li><a href="#projects" class="nav-link">Projects</a></li>
            <li><a href="#certificates" class="nav-link">Certificates</a></li>
            <li><a href="#contact" class="nav-contact">Contact Me ↗</a></li>
        </ul>
    </nav>

    <script>
        const menuToggle = document.getElementById("menuToggle");
        const navLinks = document.getElementById("navLinks");

        // Buka dan tutup menu hamburger
        menuToggle.addEventListener("click", function () {
            navLinks.classList.toggle("show");

            const isOpen = navLinks.classList.contains("show");

            menuToggle.setAttribute("aria-expanded", isOpen);
            menuToggle.setAttribute(
                "aria-label",
                isOpen ? "Tutup menu" : "Buka menu"
            );
        });

        // Tutup menu setelah link diklik
        document.querySelectorAll(".nav-links a").forEach(link => {
            link.addEventListener("click", () => {
                navLinks.classList.remove("show");
                menuToggle.setAttribute("aria-expanded", "false");
                menuToggle.setAttribute("aria-label", "Buka menu");
            });
        });
    </script>

</body>
</html>
